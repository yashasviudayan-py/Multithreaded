name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: threadline_test
          POSTGRES_USER: threadline
          POSTGRES_PASSWORD: threadline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U threadline -d threadline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://threadline:threadline@localhost:5432/threadline_test
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-features
      - name: Unit tests
        # The postgres feature selects the PostgreSQL backend, while unit
        # tests deliberately use isolated SQLite in-memory databases. Run
        # that suite with the default backend; PostgreSQL is tested below
        # against the CI service.
        run: cargo test --lib
      - name: Integration tests (sequential to avoid port exhaustion)
        run: |
          cargo test --test phase1_integration -- --test-threads=1
          cargo test --test phase2_integration -- --test-threads=1
          cargo test --test phase4_integration -- --test-threads=1
          cargo test --test phase5_integration -- --test-threads=1
          cargo test --test phase6_integration -- --test-threads=1
          cargo test --test phase7_integration -- --test-threads=1
          cargo test --test phase8_integration -- --test-threads=1
          cargo test --test proxy_integration -- --test-threads=1
          cargo test --test postgres_integration --features postgres -- --test-threads=1
      - name: Criterion benchmarks (compile-only)
        run: cargo bench --no-run

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run security audit
        run: cargo audit
